name: Windows CI
on:
  push:
    branches: ["feature/first-playable-launcher"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Build portable app
        run: pyinstaller --noconfirm --windowed --name "Lazy Launcher" main.py
      - name: Archive portable app
        run: Compress-Archive -Path "dist/Lazy Launcher" -DestinationPath "Lazy-Launcher-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Lazy-Launcher-Windows-x64
          path: Lazy-Launcher-Windows-x64.zip
          if-no-files-found: error
