[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="lazy-launcher"
version="0.1.0"
requires-python=">=3.10"
dependencies=["PySide6>=6.7,<7"]
[project.optional-dependencies]
dev=["pytest>=8","pyinstaller>=6"]
[tool.pytest.ini_options]
testpaths=["tests"]
